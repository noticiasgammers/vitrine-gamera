name: Atualizar jogos

on:
  schedule:
    - cron: '0 9 * * *'   # todo dia às 06:00 (horário de Brasília)
  workflow_dispatch:       # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar jogos na RAWG
        env:
          RAWG_KEY: ${{ secrets.RAWG_KEY }}
        run: node scripts/update.mjs

      - name: Salvar games.json no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/games.json
          git diff --staged --quiet || git commit -m "Atualiza jogos"
          git push
